[package]
name = "agent-policy-pdp"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_policy_pdp"
path = "src/lib.rs"

[dependencies]
cedar-policy = "4.10.0"
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
